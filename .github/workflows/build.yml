# Builds and tests the app in Release mode, makes its installer, and publishes it as a GitHub release.
# It's started by the Release workflow, which fills in the version so this run's title shows it.
# It can also be started by hand: GitHub, the repository's Actions tab, "Build", "Run workflow".
#
# Each successful run gets a version, tags its commit with it, such as v0.0.3, and creates a release with the installer,
# which the installed updater also downloads to update. Leave the version empty to take the highest tagged version and add 1
# to its last number, or enter one, such as 2.0.0, to set it. Later runs then count up from there.
name: Build
# The title in the Actions list. Started by hand without a version, it gets its number only after the title is set,
# so its summary page shows the number instead.
run-name: Build ${{ inputs.version || '(next version)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 2.0.0. Leave empty to add 1 to the last version."
        required: false
        default: ""

permissions:
  # Write access is needed to push the version tag.
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The whole history, so the version tags are there.
          fetch-depth: 0

      # Release fills the version in. Started directly without one, it's worked out the same way.
      - name: Choose the version
        id: version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $version = ./.github/scripts/Get-NextVersion.ps1 -Requested $env:REQUESTED
          Write-Host "Building version $version"
          "number=$version" >> $env:GITHUB_OUTPUT
          "## Version $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore BluetoothAudioManager.slnx

      - name: Build
        run: dotnet build BluetoothAudioManager.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.number }}

      - name: Test
        run: dotnet test BluetoothAudioManager.slnx --configuration Release --no-build --verbosity normal

      # The app and the updater service, each self-contained so they need nothing installed, zipped for the installer
      # to carry. The zip only goes into the installer, not the release.
      # The update token from the repository's secrets is built into the updater, which downloads from the private repository.
      - name: Make the package
        shell: pwsh
        env:
          UpdateToken: ${{ secrets.UPDATE_TOKEN }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          if (-not $env:UpdateToken) {
            throw "The UPDATE_TOKEN secret is missing, so the app couldn't update itself. Add it in the repository's Settings, Secrets and variables, Actions."
          }
          dotnet publish BluetoothAudioManager.App --configuration Release --runtime win-x64 --self-contained --output package/app -p:Version=$env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish BluetoothAudioManager.Updater --configuration Release --output package/updater -p:Version=$env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path package/app, package/updater -DestinationPath package/BluetoothAudioManager.zip

      # The release's one file: the installer, carrying the package, self-contained in a single file so it needs nothing
      # installed. The installed updater downloads this same file and runs it to update.
      - name: Make the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          dotnet publish BluetoothAudioManager.Installer --configuration Release --output installer `
            -p:Version=$env:VERSION `
            -p:AppPackage="$PWD/package/BluetoothAudioManager.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item installer/BluetoothAudioManager.Installer.exe release/BluetoothAudioManager-Setup.exe

      # After everything that can fail, so only a build that passed takes up a version.
      - name: Tag the version
        run: |
          git tag v${{ steps.version.outputs.number }}
          git push origin v${{ steps.version.outputs.number }}

      # Shown in the Releases box on the repository's main page, with the installer. GitHub lists its SHA-256 checksum,
      # which the updater checks downloads against. The notes list the changes since the previous release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v${{ steps.version.outputs.number }}
          release/BluetoothAudioManager-Setup.exe
          --title v${{ steps.version.outputs.number }} --generate-notes --verify-tag
