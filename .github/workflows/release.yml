# Starts a release: works out the next version, then starts the Build workflow with it filled in,
# so the Build run's title in the Actions list shows the real version, such as "Build 0.0.5".
# A run's title is set as it starts, before anything inside it runs, so Build can't show a version it works out itself.
# It runs only when started by hand: GitHub, the repository's Actions tab, "Release", "Run workflow".
name: Release
run-name: Release ${{ inputs.version || 'the next version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 2.0.0. Leave empty to add 1 to the last version."
        required: false
        default: ""

permissions:
  contents: read
  # Needed to start the Build workflow.
  actions: write

jobs:
  start-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The whole history, so the version tags are there.
          fetch-depth: 0

      - name: Choose the version and start Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          $version = ./.github/scripts/Get-NextVersion.ps1 -Requested $env:REQUESTED
          gh workflow run build.yml --ref "${{ github.ref_name }}" -f version=$version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Host "Started Build $version"
          "## Started Build $version" >> $env:GITHUB_STEP_SUMMARY
